plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    mods {
        'yumis_sky_island' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Compile against the supported baseline; exercise newer JEI at runtime.
    compileOnly "mezz.jei:jei-26.2-fabric-api:${jei_api_version}"
    runtimeOnly("mezz.jei:jei-26.2-fabric:${jei_runtime_version}") { transitive = false }
    implementation 'com.electronwill.night-config:core:3.8.3'
    implementation 'com.electronwill.night-config:toml:3.8.3'
    include 'com.electronwill.night-config:core:3.8.3'
    include 'com.electronwill.night-config:toml:3.8.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
processResources {
    doFirst {
        new File(destinationDir, 'defaults/yumis_sky_island/gameplay/experience_lottery.toml').delete()
        ['production', 'unlocks', 'shipping_chest'].each {
            new File(destinationDir, "defaults/yumis_sky_island/automation/${it}.toml").delete()
        }
    }
    inputs.property 'modVersion', project.version
    filesMatching('fabric.mod.json') { expand modVersion: project.version }
    from('config/yumis_sky_island') {
        include '**/*.toml'
        into 'defaults/yumis_sky_island'
    }
}
