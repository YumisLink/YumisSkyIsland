# 同稀有度中的抽取权重；正整数，越大越容易抽到
# 基础价格的推导来源；资料字段
# 旧价格资料，仅用于追踪，不参与当前计算
# 旧交易方式资料，不参与当前运行
# 旧稀有度资料，不参与当前运行
# 额外购入倍率，万分比；10000=1倍，必须为正，不抬高收购价
