# 管理员编辑：/is admin edit on；本文件仅白名单字段支持游戏内保存后实时生效。
# Yumi 空岛可编辑配置；UTF-8。手改后重启；管理员白名单字段通过编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 资料来源与版本追踪；说明字段
effectivePrice = "max(100, floor(baseValue * marketMultiplier)) * qualityMultiplier * enchantmentMultipliers"
shopRevision = "control-panel-v4"

[source]
# 配置字段 jarName
jarName = "xplus.jar"
# 配置字段 jarSha1
jarSha1 = "2dc72797acbc1b63fc16a11c4ac393605f453754"
# 配置字段 javaVersion
javaVersion = 25
# 配置字段 protocolVersion
protocolVersion = 776
# 配置字段 itemCandidateSource
itemCandidateSource = "assets/minecraft/items"
# 配置字段 candidateCount
candidateCount = 1537
# 配置字段 vanillaRecipeCount
vanillaRecipeCount = 1585
# 配置字段 parsedRecipeCount
parsedRecipeCount = 1536
# 配置字段 worldTransformCostPaths
worldTransformCostPaths = 128
# 配置字段 enchantmentCount
enchantmentCount = 43
# 配置字段 potionCount
potionCount = 46
# 配置字段 customProductCount
customProductCount = 1
# 配置字段 verificationRequired
verificationRequired = ["BuiltInRegistries.ITEM", "Item.BY_BLOCK", "BuiltInRegistries.POTION", "world enchantment registry", "CreativeModeTabs"]
# 可交易商品目录；每项必须可出售、正价且能通过实际组件校验

[products]
# 注册 ID／组件参数；保持 ID 原样

[products."minecraft:acacia_log"]
# 商品固定 ID；须与表键一致
productId = "minecraft:acacia_log"
# 标准物品模板；用于同名不同组件的商品匹配
