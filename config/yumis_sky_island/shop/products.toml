categoryHint = "自然方块"
baseValueCoins = 400
tradeMode = "buy_sell"
acquisitionNote = "树种启动后可再生；派生制作按原版配方"
dailyStock = 64
offerWeight = 1
priceOrigin = "category_draft"
legacyBaseValueCoins = 40
legacyTradeMode = "buy_sell"
legacyRarity = "rare"
buyMultiplierBps = 10000
shopCategory = "minecraft:building_blocks"
shopRule = "保留基础原木、木板、原始石材；可买可卖"
firstAcquisitionPremium = false

[products."minecraft:acacia_log".canonicalStack]
