# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 说明字段 levelKind；资料用途，不单独改变运行行为；当前默认："current_party_island_level"
levelKind = "current_party_island_level"
# 本区间起始等级；非负整数；当前默认：0
minLevel = 0
# 等级上限资料；岛／职业默认为100；当前默认：100
maxLevel = 100
# 说明字段 unlockPolicy；资料用途，不单独改变运行行为；当前默认："current_level_required_for_purchase"
unlockPolicy = "current_level_required_for_purchase"
# 说明字段 sellRequiresUnlock；资料用途，不单独改变运行行为；当前默认：false
sellRequiresUnlock = false
# 商品购买等级门槛；0～100，出售不要求购买等级
shopRevision = "q34-q48-material-shop-v2"

