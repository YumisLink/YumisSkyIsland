# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 说明字段 unit；资料用途，不单独改变运行行为；当前默认："basis_points_10000_equals_1"
unit = "basis_points_10000_equals_1"
# 说明字段 combineRule；资料用途，不单独改变运行行为；当前默认："multiply_all_then_round_once"
combineRule = "multiply_all_then_round_once"
# 说明字段 unknownEnchantmentPolicy；资料用途，不单独改变运行行为；当前默认："refuse_automatic_sale"
unknownEnchantmentPolicy = "refuse_automatic_sale"
# 说明字段 rejectAboveVanillaMaxLevel；资料用途，不单独改变运行行为；当前默认：true
rejectAboveVanillaMaxLevel = true
# 说明字段 rejectIncompatibleCombinations；资料用途，不单独改变运行行为；当前默认：true
rejectIncompatibleCombinations = true
