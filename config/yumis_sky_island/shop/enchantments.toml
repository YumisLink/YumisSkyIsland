# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 配置字段 unit
unit = "basis_points_10000_equals_1"
# 配置字段 combineRule
combineRule = "multiply_all_then_round_once"
# 配置字段 unknownEnchantmentPolicy
unknownEnchantmentPolicy = "refuse_automatic_sale"
# 配置字段 rejectAboveVanillaMaxLevel
rejectAboveVanillaMaxLevel = true
# 配置字段 rejectIncompatibleCombinations
rejectIncompatibleCombinations = true
# 附魔估值定义；任务奖励不受商店附魔上限限制

[entries]
# 注册 ID／组件参数；保持 ID 原样

[entries."minecraft:aqua_affinity"]
# 界面显示名称
name = "水下速掘"
# 等级上限资料；岛／职业默认为100
maxLevel = 1
# 按实际附魔等级配置的价值倍率；万分比，非负整数
isCurse = false
isTreasure = false
supportedItems = "#minecraft:enchantable/head_armor"

[entries."minecraft:aqua_affinity".levelMultiplierBps]
# 等级／阶段 1 对应值
1 = 11000
