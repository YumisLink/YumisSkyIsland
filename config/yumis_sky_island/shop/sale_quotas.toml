# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 共享范围说明；目前按队伍共享，不通过此字段切换范围；当前默认："party"
scope = "party"
# 说明字段 epochSource；资料用途，不单独改变运行行为；当前默认："shop_marketEpoch"
epochSource = "shop_marketEpoch"
# 说明字段 defaultGroup；资料用途，不单独改变运行行为；当前默认："canonical_item_id"
defaultGroup = "canonical_item_id"
# 说明字段 defaultUnitsPerItem；资料用途，不单独改变运行行为
counterUsesExactRationals = true
splitAnItemAcrossTierBoundaries = true
sumAllLinesThenFloorCoins = true
zeroCoinTransaction = "refuse_without_removing_items_or_advancing_counters"
channels = ["shop_ui", "sell_hand", "sell_inventory", "shipping_chest"]
multiIngredientGoods = "independent_item_quota_unless_explicit_equivalent"
tierCounterChangesOnlyOnSuccessfulSale = true

[defaultUnitsPerItem]
# 每件原料等份分子；正整数；当前默认：1
numerator = 1
# 每件原料等份分母；正整数；当前默认：1
denominator = 1
