# 每队按物品注册 ID 独立累计当日实际售出件数；所有品质和出售入口共用。
# 04:00 刷新计数。收购价先应用当天行情、品质、合法附魔与耐久，
# 再按下面的件数阶梯计算，整笔交易最后取整一次。
schemaVersion = 1
counterKey = "item_id"

[[tiers]]
# 第 1～128 件：基础价值的 10%。
upToUnits = 128
saleMultiplierBps = 1000

[[tiers]]
# 第 129～320 件：基础价值的 5%。
upToUnits = 320
saleMultiplierBps = 500

[[tiers]]
# 第 321～640 件：基础价值的 1%。
upToUnits = 640
saleMultiplierBps = 100

[[tiers]]
# 第 641 件起：基础价值的 0.5%，不设数量上限。
saleMultiplierBps = 50
