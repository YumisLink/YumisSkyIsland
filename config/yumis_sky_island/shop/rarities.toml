# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 说明字段 independentOfProfessionQuality；资料用途，不单独改变运行行为；当前默认：true
independentOfProfessionQuality = true
# 稀有度定义与市场抽取权重
shopRevision = "q34-q48-material-shop-v2"

[definitions]
# 说明字段 common；资料用途，不单独改变运行行为

[definitions.common]
# 界面显示名称；当前默认："普通"
name = "普通"
# 说明字段 regularAllowed；资料用途，不单独改变运行行为；当前默认：true
regularAllowed = true
# 每日稀有度抽取权重；非负整数，候选存在时参与抽取；当前默认：0
dailyWeight = 0
# 隐藏补余商品的稀有度权重；非负整数，先抽保底再补余；当前默认：0
hiddenWeight = 0
# 说明字段 rare；资料用途，不单独改变运行行为

