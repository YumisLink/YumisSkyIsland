# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 全服市场行情与轮次参数
stockSource = "products.dailyStock"
purchaseQuality = "ordinary"
dailyPriceMultiplierBps = 10000
stableStateKey = ["partyId", "marketEpoch"]
effectivePrice = "max(100, floor(baseValue * marketMultiplier)) * qualityMultiplier * enchantmentMultipliers"
sellRule = "floor(sum(effectiveFullValue * durabilityMultiplier / saleDivisor * quota_segment_weight))"
saleQuotaConfig = "shop/sale_quotas.toml"
rounding = "once_per_transaction_after_all_lines"
shopRevision = "control-panel-v4"
saleDivisor = 1
buyRule = "floor(purchaseBaseAfterMarket * quality * enchantments * productBuyMultiplier * regularShopMultiplier)"
regularBuyMultiplierBps = 25000

# 仅增加指定物品的收购收入；不改变购买、品质概率或售出额度计件。
[cropSales]
items = ["minecraft:wheat", "minecraft:sweet_berries", "minecraft:carrot", "minecraft:potato", "minecraft:beetroot", "minecraft:pumpkin", "minecraft:melon_slice", "minecraft:sugar_cane", "minecraft:cocoa_beans", "minecraft:nether_wart", "minecraft:chorus_fruit"]
# 收购基础倍率，万分比；20000表示当前收入的2倍。
baseMultiplierBps = 20000
# 在既有品质价值倍率上再乘以下系数；10000=1倍。
# 默认翻倍后的作物星级相对普通为4／18／60／150／6000。
[cropSales.gradeMultiplierBps]
ordinary = 10000
copper = 20000
silver = 30000
gold = 40000
diamond = 50000
prismatic = 60000

[market]
# 每个主世界游戏日跨过04:00（绝对日时刻22000）刷新一次，睡眠和跳时均有效。
refreshAtDayTick = 22000
# 配置字段 anchorToBasePrice
anchorToBasePrice = true
# 行情最低万分比；9000表示基础价的90%
minPriceBps = 9000
# 行情最高万分比；11000表示基础价的110%，不得小于最低值
maxPriceBps = 11000
# 配置字段 sharedQuotesAcrossParties
sharedQuotesAcrossParties = true
# 行情后的基础全价下限，使用当前货币单位；正整数
minimumCurrentBaseValueCoins = 100
# 每日商店参数；默认12种，全队共享库存

[daily]
# 共享范围说明；目前按队伍共享，不通过此字段切换范围
scope = "party"
# 当轮最多商品种数；正整数，候选不足时只显示可抽数量
slots = 12
# 配置字段 onlyEligibleAtRollTime
onlyEligibleAtRollTime = true
# 配置字段 sampling
sampling = "weighted_rarity_then_weighted_product_without_replacement"
# 配置字段 limitSharedAcrossParty
limitSharedAcrossParty = true
# 配置字段 unusedStockCarriesOver
unusedStockCarriesOver = false
# 隐藏商店参数；当轮替代每日商店

[hidden]
# 隐藏概率，万分比；500=5%，范围0～10000
chanceBps = 500
# 配置字段 replacesDaily
replacesDaily = true
slots = 16
# 隐藏保底传说目标格数；默认1，非负整数，等级池不足逐级下降
guaranteedLegendary = 1
# 隐藏保底史诗目标格数；默认2，非负整数，等级池不足逐级下降
guaranteedEpic = 2
# 保底回退策略说明：legendary→epic→rare→common，仍遵守等级
guaranteeFallback = "legendary_epic_rare_common"
# 库存资料；实际各商品库存以 dailyStock 为准

[stockDefaults]
# 稀有档参数；用于所在表的实际权重或稀有度规则
rare = 64
# 史诗档参数；用于所在表的实际权重或稀有度规则
epic = 16
# 传说档参数；用于所在表的实际权重或稀有度规则
legendary = 1
# 配置字段 stockSource
# 配置字段 purchaseQuality
# 配置字段 dailyPriceMultiplierBps
# 配置字段 pity

[pity]
# 配置字段 enabled
enabled = false
# 配置字段 stableStateKey
# 配置字段 rerollTriggers

[rerollTriggers]
# 配置字段 login
login = false
# 配置字段 reset
reset = false
# 配置字段 levelChange
levelChange = false
# 配置字段 membershipChange
membershipChange = false
# 配置字段 sleep
sleep = false
# 配置字段 timeCommand
timeCommand = false
# 配置字段 effectivePrice
# 配置字段 sellRule
# 配置字段 saleQuotaConfig
# 配置字段 rounding
# 配置字段 durability

[durability]
# 配置字段 unit
unit = "remaining_fraction"
# 配置字段 points
interpolation = "piecewise_linear"
below50ValueBps = 0
nonDamageableValueBps = 10000

[[durability.points]]
# 配置字段 remainingBps
remainingBps = 10000
# 品质价值倍率；万分比，10000=1倍，非负整数
valueBps = 10000



[[durability.points]]
remainingBps = 8000
valueBps = 5000



[[durability.points]]
remainingBps = 5000
valueBps = 0
# 配置字段 interpolation
# 配置字段 below50ValueBps
# 配置字段 nonDamageableValueBps
# 商品政策版本说明，不用于重复涨价
# 基础全价到正常收购的除数；默认100，必须大于0
# 配置字段 buyRule
# 普通常驻商店额外购价倍率；25000=2.5倍，不影响收购或每日隐藏商店
