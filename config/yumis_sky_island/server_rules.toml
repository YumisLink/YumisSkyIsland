# 管理员编辑：/is admin edit on；本文件仅白名单字段支持游戏内保存后实时生效。
# Yumi 空岛可编辑配置；UTF-8。手改后重启；管理员白名单字段通过编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 是否允许村民交易；默认false
villagerTradingEnabled = false
# 是否允许流浪商人交易；默认false
wanderingTraderTradingEnabled = false
# 猪灵以物易物规则说明，保留原版行为
piglinBarteringEnabled = true
# 村民繁殖规则说明，保留原版行为
villagerBreedingEnabled = true
# 村民工作 AI 规则说明，保留原版行为
villagerWorkAiEnabled = true
# 铁傀儡生成规则说明，保留原版行为
ironGolemSpawningEnabled = true
# 配置字段 automationUnlockPolicy
automationUnlockPolicy = "shop_purchase_only"
