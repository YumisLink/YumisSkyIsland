# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 配置字段 independentOfItemRarity
independentOfItemRarity = true
# 配置字段 shopsOnlyOrdinary
shopsOnlyOrdinary = true
# 制造品质档位；顺序为普通、银星、金星。
professions = ["blacksmith", "chef", "farmer", "hunter", "fisherman"]
allCanBeLearned = true
# 金星装备另抽永久无限耐久，1000=10%。
goldUnbreakableChanceBps = 1000
automatedProductionQuality = "ordinary"
automatedProfessionXp = 0
zeroXpRecipeKinds = ["lossless_pack_unpack", "copy", "repair", "preview"]
qualityRollTiming = "once_after_material_consumption_before_output_transfer"

[[grades]]
# 固定 ID；已有任务不能改 ID，新增任务需唯一
id = "ordinary"
# 界面显示名称
name = "普通"
# 品质价值倍率；万分比，10000=1倍，非负整数
valueBps = 10000
# 品质最大耐久倍率；万分比，10000=1倍，正整数
durabilityBps = 10000
# 品质攻击／护甲／挖掘加成；万分比，0表示无加成。
attributeBonusBps = 0

[[grades]]
# 银星固定 ID。
id = "silver"
# 界面显示名称。
name = "银星"
# 品质价值倍率；20000=售价×2。
valueBps = 20000
# 品质最大耐久倍率；12000=×1.2。
durabilityBps = 12000
# 适用基础属性加成；2000=+20%。
attributeBonusBps = 2000

[[grades]]
# 金星固定 ID。
id = "gold"
# 界面显示名称。
name = "金星"
# 品质价值倍率；60000=售价×6。
valueBps = 60000
# 品质最大耐久倍率；20000=×2。
durabilityBps = 20000
# 适用基础属性加成；10000=+100%。
attributeBonusBps = 10000

# 个人职业 ID 清单
# 配置字段 allCanBeLearned
# 配置字段 automatedProductionQuality
# 配置字段 automatedProfessionXp
# 配置字段 zeroXpRecipeKinds
# 配置字段 qualityRollTiming
