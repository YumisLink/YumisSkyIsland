# 管理员编辑：/is admin edit on；本文件仅白名单字段支持游戏内保存后实时生效。
# Yumi 空岛可编辑配置；UTF-8。手改后重启；管理员白名单字段通过编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 个人职业经验等级曲线
# 所有职业默认开放，等级没有上限。
allCanBeLearned = true
eligibleManualSources = ["crafting", "stonecutting", "furnace", "smithing"]
minimumXpBatchSize = 1
noXpItems = ["minecraft:iron_ingot", "minecraft:gold_ingot", "minecraft:copper_ingot", "minecraft:diamond", "minecraft:emerald", "minecraft:iron_nugget", "minecraft:gold_nugget", "minecraft:copper_nugget", "minecraft:bone_meal", "minecraft:dried_kelp_block", "minecraft:iron_block", "minecraft:gold_block", "minecraft:copper_block", "minecraft:diamond_block", "minecraft:emerald_block", "minecraft:coal_block", "minecraft:redstone_block", "minecraft:lapis_block", "minecraft:slime_block", "minecraft:honey_block"]
successfulFishingXp = 12
# 岩浆获钓经验倍率；非负整数。乘在这一杆实际渔夫经验上，地区宝藏箱的固定12同样乘。
lavaFishingXpMultiplier = 5
# 虚空获钓经验倍率；非负整数。乘在这一杆实际渔夫经验上，地区宝藏箱的固定12同样乘。
voidFishingXpMultiplier = 25
# 熔岩钓鱼所需渔夫等级。仍须先购买熔岩鱼饵；等级不够时钓钩保持水域，已购买的鱼饵也不能提前使用。
lavaFishingLevel = 30
# 虚空钓鱼所需渔夫等级。仍须先购买虚空鱼饵。
voidFishingLevel = 50
# 100级及以上，每株成熟的小麦、胡萝卜、马铃薯、甜菜或下界疣额外突变的万分比。20=0.2%。50～99级取一半并向下取整。不满50级不突变。与正常掉落次数无关，活塞农场不经过本人收获所以不掷。
cropMutationBps = 20
# 同一株另一次独立判定变成空岛果的万分比。2=0.02%。50～99级取一半。可以和上面的突变同时出现。
cropFruitBps = 2
# 每次符合名单的猎物击杀经验。
successfulHunterKillXp = 6

# 各职业经验获取效率倍率：1=原速，2=双倍，0.5=一半，0=停止该职业经验与积分获取。
# 范围0～1000，最多4位小数。作用于后续真实行动，含单品baseXp；与等级折减、钓鱼地区及居民效果相乘。
# 不足1点的余数按个人、职业持久保存；职业积分仍与实际职业经验等量增加。管理员Ctrl＋】→职业经验保存后立即生效。
[experienceMultipliers]
# 铁匠
blacksmith = 1.0
# 厨师
chef = 1.0
# 农夫
farmer = 1.0
# 猎人
hunter = 1.0
# 渔夫
fisherman = 1.0
# 矿工
miner = 1.0
# 战斗大师
battle_master = 1.0

[xpCurve]
# 每级基础经验要求；非负整数
perLevelBase = 100
# 每级增加的经验要求；非负整数
perLevelGrowth = 25
# 100级起每级增量中的额外增长；曲线持续递增且不封顶。
# 战斗大师不另写曲线。服务端把本表三项都乘 5，经验要求是其它普通职业的 5 倍。
post100Growth = 100
# 每件手工制作成功给予的职业经验；非负整数

[blacksmithXpCurve]
# 铁匠独立经验曲线；其余职业继续使用 xpCurve。
perLevelBase = 100
perLevelGrowth = 2
post100Growth = 100

[successfulCraftXp]
# 配置字段 blacksmith
blacksmith = 12
# 配置字段 chef
chef = 4
# 配置字段 farmer
farmer = 3
# 配置字段 hunter
hunter = 6
# 稿子或任意锤子每挖掉一块方块固定给 1 点矿工经验，不读这里
miner = 1
