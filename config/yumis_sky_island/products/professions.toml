# 管理员编辑：/is admin edit on；本文件仅白名单字段支持游戏内保存后实时生效。
# Yumi 空岛可编辑配置；UTF-8。手改后重启；管理员白名单字段通过编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 个人职业经验等级曲线
# 所有职业默认开放，等级没有上限。
allCanBeLearned = true
eligibleManualSources = ["crafting", "stonecutting", "furnace", "smithing"]
minimumXpBatchSize = 1
noXpItems = ["minecraft:iron_ingot", "minecraft:gold_ingot", "minecraft:copper_ingot", "minecraft:diamond", "minecraft:emerald", "minecraft:iron_nugget", "minecraft:gold_nugget", "minecraft:copper_nugget", "minecraft:bone_meal", "minecraft:dried_kelp_block", "minecraft:iron_block", "minecraft:gold_block", "minecraft:copper_block", "minecraft:diamond_block", "minecraft:emerald_block", "minecraft:coal_block", "minecraft:redstone_block", "minecraft:lapis_block", "minecraft:slime_block", "minecraft:honey_block"]
successfulFishingXp = 12
# 每次符合名单的猎物击杀经验。
successfulHunterKillXp = 6

[xpCurve]
# 每级基础经验要求；非负整数
perLevelBase = 100
# 每级增加的经验要求；非负整数
perLevelGrowth = 25
# 100级起每级增量中的额外增长；曲线持续递增且不封顶。
post100Growth = 100
# 每件手工制作成功给予的职业经验；非负整数

[blacksmithXpCurve]
# 铁匠独立经验曲线；其余职业继续使用 xpCurve。
perLevelBase = 100
perLevelGrowth = 2
post100Growth = 100

[successfulCraftXp]
# 配置字段 blacksmith
blacksmith = 12
# 配置字段 chef
chef = 4
# 配置字段 farmer
farmer = 3
# 配置字段 hunter
hunter = 6
