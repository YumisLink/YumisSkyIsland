# 说明字段 islandEpochScope；资料用途，不单独改变运行行为；当前默认："party_and_dimension"
# 说明字段 resetInvalidatesEpoch；资料用途，不单独改变运行行为；当前默认："overworld_only"
# 说明字段 revalidateClaimOnEverySale；资料用途，不单独改变运行行为；当前默认：true
# 说明字段 persistPowerBaseline；资料用途，不单独改变运行行为；当前默认：true
# 说明字段 loadDoesNotCreateNewPulse；资料用途，不单独改变运行行为；当前默认：true
# 说明字段 transactionService；资料用途，不单独改变运行行为；当前默认："shared_SaleService"
# 说明字段 normalPricesAndSaleQuotas；资料用途，不单独改变运行行为；当前默认：true
# 说明字段 profits；资料用途，不单独改变运行行为；当前默认："party_wallet"
# 说明字段 keepUnpricedUnsafeAndZeroValueItems；资料用途，不单独改变运行行为；当前默认：true
# 说明字段 zeroCoinBatch；资料用途，不单独改变运行行为；当前默认："keep_all_and_wait_for_larger_batch"
# 说明字段 execution；资料用途，不单独改变运行行为；当前默认："deferred_server_tick_transaction"
# 说明字段 inventoryOrder；资料用途，不单独改变运行行为；当前默认："ascending_slot_index"
# 说明字段 maxPendingJobsPerBox；资料用途，不单独改变运行行为；当前默认：1
# 说明字段 duplicateNotifications；资料用途，不单独改变运行行为；当前默认："coalesce_existing_job"
# 说明字段 pulsesWhileBusy；资料用途，不单独改变运行行为；当前默认："not_queued_as_additional_jobs"
# 说明字段 requireNewRisingEdgeAfterCompletion；资料用途，不单独改变运行行为；当前默认：true
# 说明字段 sharedGlobalComputeBudgetMicrosPerTick；资料用途，不单独改变运行行为；当前默认：1000
