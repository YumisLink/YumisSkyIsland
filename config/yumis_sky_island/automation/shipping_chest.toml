# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 说明字段 blockId；资料用途，不单独改变运行行为；当前默认："yumis_sky_island:shipping_chest"
blockId = "yumis_sky_island:shipping_chest"
# 有效注册物品 ID，例如 minecraft:oak_log；当前默认："yumis_sky_island:shipping_chest"
itemId = "yumis_sky_island:shipping_chest"
# 说明字段 appearance；资料用途，不单独改变运行行为；当前默认："vanilla_normal_chest_with_original_renderer"
appearance = "vanilla_normal_chest_with_original_renderer"
# 说明字段 inventorySlots；资料用途，不单独改变运行行为；当前默认：27
inventorySlots = 27
# 说明字段 doubleChestEnabled；资料用途，不单独改变运行行为；当前默认：false
doubleChestEnabled = false
# 说明字段 hopperCompatible；资料用途，不单独改变运行行为；当前默认：true
hopperCompatible = true
# 说明字段 recipe；资料用途，不单独改变运行行为
shopPurchaseEnabled = false
craftRequiresLevel = false
trigger = "redstone_rising_edge_only"
scanOnContinuousPower = false
binding = "party_of_actual_claim_at_server_placement"
islandEpochScope = "party_and_dimension"
resetInvalidatesEpoch = "overworld_only"
revalidateClaimOnEverySale = true
persistPowerBaseline = true
loadDoesNotCreateNewPulse = true
transactionService = "shared_SaleService"
normalPricesAndSaleQuotas = true
profits = "party_wallet"
keepUnpricedUnsafeAndZeroValueItems = true
zeroCoinBatch = "keep_all_and_wait_for_larger_batch"
execution = "deferred_server_tick_transaction"
inventoryOrder = "ascending_slot_index"
maxPendingJobsPerBox = 1
duplicateNotifications = "coalesce_existing_job"
pulsesWhileBusy = "not_queued_as_additional_jobs"
requireNewRisingEdgeAfterCompletion = true
sharedGlobalComputeBudgetMicrosPerTick = 1000
forceLoadUnloadedChunks = false
stateFields = ["partyId", "dimensionId", "islandEpoch", "boxId", "powerBaseline", "activationSeq", "pendingSaleId", "lastCommittedSaleId"]
durabilityPolicy = "same_as_manual_sale"
protection = "normal_island_container_and_cross_boundary_hopper_rules"
restartRecovery = "durable_journal_and_idempotent_commit_before_accepting_further_transactions"

[recipe]
# 说明字段 type；资料用途，不单独改变运行行为；当前默认："minecraft:crafting_shaped"
type = "minecraft:crafting_shaped"
# 说明字段 pattern；资料用途，不单独改变运行行为
pattern = ["IRI", "RCR", "IRI"]
# 说明字段 key；资料用途，不单独改变运行行为

[recipe.key]
# 说明字段 I；资料用途，不单独改变运行行为；当前默认："minecraft:iron_ingot"
I = "minecraft:iron_ingot"
# 说明字段 R；资料用途，不单独改变运行行为；当前默认："minecraft:redstone"
R = "minecraft:redstone"
# 说明字段 C；资料用途，不单独改变运行行为；当前默认："minecraft:chest"
C = "minecraft:chest"
# 说明字段 result；资料用途，不单独改变运行行为

[recipe.result]
# 固定 ID；已有任务不能改 ID，新增任务需唯一；当前默认："yumis_sky_island:shipping_chest"
id = "yumis_sky_island:shipping_chest"
# 说明字段 count；资料用途，不单独改变运行行为；当前默认：1
count = 1
# 说明字段 shopPurchaseEnabled；资料用途，不单独改变运行行为；当前默认：false
# 说明字段 craftRequiresLevel；资料用途，不单独改变运行行为；当前默认：false
# 说明字段 trigger；资料用途，不单独改变运行行为；当前默认："redstone_rising_edge_only"
# 说明字段 scanOnContinuousPower；资料用途，不单独改变运行行为；当前默认：false
