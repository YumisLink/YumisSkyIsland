# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 等级上限资料；岛／职业默认为100；当前默认：100
maxLevel = 100
# 说明字段 keepRawPointsAboveMax；资料用途，不单独改变运行行为；当前默认：true
keepRawPointsAboveMax = true
# 0～100级所需分数表；级数连续、门槛严格递增
legacy30LevelMapping = "new_threshold(L)=old_top_score*L/100"
chapterLevelRequirements = [0, 3, 10, 27, 50, 100]
chapterResearchCoins = [0, 2000, 20000, 100000, 1000000, 10000000]

