# 管理员编辑：/is admin edit on；本文件仅白名单字段支持游戏内保存后实时生效。
# Yumi 空岛可编辑配置；UTF-8。手改后重启；管理员白名单字段通过编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 全服每刻刷新计算预算，单位微秒；默认1000，正整数
globalComputeBudgetMicrosPerTick = 1000
# 每刻最多计数区段数量；默认2，正整数
maxSectionsPerTick = 2
# 每刻最多新异步区块读取数；默认1，正整数
maxNewChunkRequestsPerTick = 1
# 同时异步读取上限；默认2，正整数
maxConcurrentChunkRequests = 2
# 配置字段 forceGenerateMissingChunks
forceGenerateMissingChunks = false
# 配置字段 blockMainThreadOnDisk
blockMainThreadOnDisk = false
# 配置字段 onlyExistingChunks
onlyExistingChunks = true
# 配置字段 maxJobsPerParty
maxJobsPerParty = 1
# 配置字段 duplicateRequests
duplicateRequests = "reuse_existing_job"
# 配置字段 queue
queue = "round_robin_across_parties"
# 配置字段 captureConcurrentBlockChanges
captureConcurrentBlockChanges = true
# 配置字段 progressUpdateTicks
progressUpdateTicks = 100
# 配置字段 checkpointOnChunkCompletion
checkpointOnChunkCompletion = true
# 配置字段 resumeAfterRestart
resumeAfterRestart = true
# 配置字段 publishNewScore
publishNewScore = "after_consistent_scan_complete"
# 配置字段 slowTickPolicy
slowTickPolicy = "reduce_budget_and_pause_new_load_requests"
