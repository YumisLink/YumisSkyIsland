# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则；当前默认："review_draft"
status = "review_draft"
# 目标 Minecraft 版本；资料字段；当前默认："26.2"
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证；当前默认：false
registryVerified = false
# 说明字段 dimension；资料用途，不单独改变运行行为；当前默认："minecraft:overworld"
dimension = "minecraft:overworld"
# 资料来源与版本追踪；说明字段；当前默认："current_world_stock_not_lifetime_placements"
source = "current_world_stock_not_lifetime_placements"
# 内部定点分数精度说明；目前固定10000；当前默认：10000
pointScale = 10000
# 递减阶梯；数量上限须递增，最后省略上限表示无限
placementMappingAuthority = "runtime_Item.BY_BLOCK_and_item_use_handlers"

[tiers]
# 说明字段 default；资料用途，不单独改变运行行为

[[tiers.default]]
# 本档累计方块数量上限；省略表示无限，非负整数；当前默认：64
upToCount = 64
# 计分倍率，万分比；10000=100%，非负整数；当前默认：10000
multiplierBps = 10000

[[tiers.default]]
# 本档累计方块数量上限；省略表示无限，非负整数；当前默认：320
upToCount = 320
# 计分倍率，万分比；10000=100%，非负整数；当前默认：2500
multiplierBps = 2500

[[tiers.default]]
# 本档累计方块数量上限；省略表示无限，非负整数；当前默认：2048
upToCount = 2048
# 计分倍率，万分比；10000=100%，非负整数；当前默认：500
multiplierBps = 500

[[tiers.default]]
# 计分倍率，万分比；10000=100%，非负整数；当前默认：100
multiplierBps = 100
