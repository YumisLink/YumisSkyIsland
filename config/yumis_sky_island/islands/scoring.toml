# Yumi 空岛可编辑配置；UTF-8。基础分手改后重启；高分递减档位和通告可在管理员实时编辑器保存生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 1
# 配置审阅状态；资料字段，不改变运行规则
status = "review_draft"
# 目标 Minecraft 版本；资料字段
minecraftVersion = "26.2"
# 资料提取时的校验标记；启动时仍逐项进行真实注册表验证
registryVerified = false
# 配置字段 dimension
dimension = "minecraft:overworld"
# 资料来源与版本追踪；说明字段
source = "current_world_stock_not_lifetime_placements"
# 内部定点分数精度说明；目前固定10000
pointScale = 10000
# 仅基础分>5应用本阶梯；≤5不递减。每档逐块向下取整且最低1分。阈值须递增，最后无限。
placementMappingAuthority = "runtime_Item.BY_BLOCK_and_item_use_handlers"

[tiers]
# 配置字段 default

[[tiers.default]]
# 本档累计方块数量上限；省略表示无限，非负整数
upToCount = 256
# 计分倍率，万分比；10000=100%，非负整数
multiplierBps = 10000


[[tiers.default]]
upToCount = 2048
multiplierBps = 2500


[[tiers.default]]
upToCount = 8192
multiplierBps = 500


[[tiers.default]]
multiplierBps = 100
# 独立方块计分目录；删除商品价格不删除方块计分


# 手动放置和建造杖跨档时，通知本队在线正式成员；跌破再到达会重发
[notices]
# 是否启用本队跨档通告
enabled = true
# 通告文案；{block}方块、{threshold}阈值、{nextPoints}后续每块分数、{nextMultiplier}后续倍率百分数
message = "本岛{block}已达{threshold}块；后续每块{nextPoints}分（倍率{nextMultiplier}%，最低1分）。"

[blocks]
# 注册 ID／组件参数；保持 ID 原样

