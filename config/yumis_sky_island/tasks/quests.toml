# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低
schemaVersion = 3
# 全服成长任务定义；按数组顺序排列主线，支线独立
revision = 1

[[quests]]
# 固定 ID；已有任务不能改 ID，新增任务需唯一
id = "first_cobblestone"
# 界面显示名称
name = "第一桶圆石"
# 任务材料列表；只限制明确配置的属性，附魔／品质至少达到指定值
rewardCoins = 0
unlockFeatures = []
kind = "main"
objective = "materials"

[[quests.requirements]]
# 所需物品数量；正整数
quantity = 64
# 有效注册物品 ID，例如 minecraft:oak_log
itemId = "minecraft:cobblestone"
# 领奖物品列表；空间不足时材料与奖励均不改变

[[quests.rewardItems]]
id = "minecraft:golden_pickaxe"
# 配置字段 count
count = 1
# 合法 Minecraft 物品组件；用于附魔／药水等条件或奖励

[quests.rewardItems.components]
# 注册 ID／组件参数；保持 ID 原样

[quests.rewardItems.components."minecraft:enchantments"]
"minecraft:unbreaking" = 4
"minecraft:efficiency" = 5
# 金币奖励；非负64位整数，0表示无金币
# 任务完成时永久授予的预设功能 ID；删除／重置不撤销
# 任务类型：main 为顺序主线；side 为独立支线
# 目标：materials 提交材料；place_shipping_chest 真实放置出货箱



[[quests]]
id = "place_shipping_chest"
name = "使用出货箱"
kind = "side"
objective = "place_shipping_chest"
requirements = []
rewardCoins = 0
unlockFeatures = []

[[quests.rewardItems]]
id = "minecraft:oak_log"
count = 64



[[quests.rewardItems]]
id = "minecraft:iron_ingot"
count = 3



[[quests.rewardItems]]
id = "minecraft:golden_pickaxe"
count = 1

[quests.rewardItems.components]

[quests.rewardItems.components."minecraft:enchantments"]
"minecraft:unbreaking" = 4
"minecraft:efficiency" = 5
# 任务定义修订号；编辑器保存时递增，用于拒绝旧请求
# 独立的预设功能目录；权限不由任务数量决定



[[quests]]
id = "fisherman_01"
name = "渔夫的最爱"
# 任务类型：main 队伍主线；side 个人支线；profession 个人职业任务
kind = "profession"
# 手工制造所属职业 ID
profession = "fisherman"
# 目标：materials 提交材料；place_shipping_chest 本人放置；tracked 追踪本人行动
objective = "tracked"
requirements = []
# 本人行动追踪条件列表；不扣物，只累计当前已解锁目标
rewardItems = []
rewardCoins = 500
rewardExperiencePoints = 0
unlockFeatures = []

[[quests.goals]]
# 行动：craft 制作加工；smelt 手动领取熔炼；fish 钓鱼；harvest 采集掉落；kill 本人击杀
type = "craft"
# 目标物品或生物注册ID；kill 使用生物ID，其余使用物品ID
targetId = "minecraft:fishing_rod"
quantity = 1
