# Yumi 空岛可编辑配置；UTF-8。服务端规则重启生效，任务编辑器保存立即生效。
# 省略原空值字段保留无限／继承含义。带冒号或点号的注册 ID 必须保持引号。

# 配置结构版本；资料字段，勿随意降低；当前默认：1
schemaVersion = 1
# 初始全队共享悬赏格数；默认3，1～maximumSlots；当前默认：3
initialSlots = 3
# 悬赏格上限；默认50，1～50；当前默认：50
maximumSlots = 50
# 最高岛等级每达到多少级永久增加一格；默认10，正整数；当前默认：10
levelsPerSlot = 10
# 第一格额外悬赏格价格，金币；默认100000，非负整数；当前默认：100000
firstSlotCost = 100000
# 后续购格阶梯基价，金币；默认500000，正整数；当前默认：500000
subsequentSlotCostStep = 500000
# 每条悬赏独立有效天数；默认7，正整数；当前默认：7
durationGameDays = 7
# 每种奖励最多尝试材料种数；1～5；当前默认：5
materialAttemptsPerReward = 5
# 每条悬赏最多提交数量；1～1536；当前默认：1536
maximumMaterialQuantity = 1536
# 悬赏奖励的稀有／史诗／传说权重；非负，总和大于0

[rarityWeights]
# 说明字段 rare；资料用途，不单独改变运行行为；当前默认：70
rare = 70
# 说明字段 epic；资料用途，不单独改变运行行为；当前默认：25
epic = 25
# 说明字段 legendary；资料用途，不单独改变运行行为；当前默认：5
legendary = 5
